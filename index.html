<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIAGRAMAXIS. — Un juego contra el silencio sistémico · Angel Peña Villegas</title>
    <!-- Tema: día por defecto; aplica la clase .dark antes del primer paint
         si el usuario guardó el modo nocturno (evita flash). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('diagramaxis-theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* almacenamiento no disponible: se queda en día */
        }
      })();
    </script>
    <style>
      html { background: #faf9f6; color-scheme: light; }
      html.dark { background: #0f1013; color-scheme: dark; }
    </style>
    <!-- Google Fonts: Cormorant Garamond & DM Mono & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-diagramaxis-bg text-diagramaxis-text font-mono text-[13px] overflow-hidden select-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
